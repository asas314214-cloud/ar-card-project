
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bamby 動態角色 AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- GIF 動畫解碼工具 -->
  <script src="https://cdn.jsdelivr.net/gh/themadcreator/gifler@master/gifler.min.js"></script>

  <script>
    // GIF Canvas 動態材質
    AFRAME.registerComponent('gif-texture', {
      schema: {
        src: { type: 'selector' }
      },

      init: function () {
        this.canvas = this.data.src;

        this.texture = new THREE.CanvasTexture(this.canvas);
        this.texture.colorSpace = THREE.SRGBColorSpace;

        this.applied = false;
      },

      tick: function () {
        const mesh = this.el.getObject3D('mesh');

        // 等待 AR 平面建立
        if (mesh && !this.applied) {
          mesh.material = new THREE.MeshBasicMaterial({
            map: this.texture,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false
          });

          this.applied = true;
        }

        // 持續更新 GIF 動畫材質
        this.texture.needsUpdate = true;
      },

      remove: function () {
        this.texture.dispose();
      }
    });

    // 啟動 GIF
    window.addEventListener('load', function () {
      const canvas = document.querySelector('#gifCanvas');

      gifler('assets/bamby.gif').animate('#gifCanvas');
    });
  </script>

</head>

<body>

  <!-- 隱藏的 GIF 動畫畫布 -->
  <canvas
    id="gifCanvas"
    width="2000"
    height="2000"
    style="display:none">
  </canvas>

  <a-scene
  mindar-image="
    imageTargetSrc: assets/bamby.mind;
  "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- AR 攝影機 -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- 圖片辨識目標 -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Bamby 動態角色 -->
      <a-plane
        position="0 0 0.1"
        width="0.55"
        height="0.55"
        gif-texture="src: #gifCanvas">
      </a-plane>

    </a-entity>

  </a-scene>

</body>
</html>
